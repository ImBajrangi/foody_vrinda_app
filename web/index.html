    }
    #loading-splash {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: fixed;
      inset: 0;
      background: #121011;
      z-index: 99999;
      transition: opacity 0.4s ease-out;
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.5; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.08); }
    }
    @keyframes progressAnim {
      0% { left: -40%; width: 30%; }
      50% { left: 30%; width: 50%; }
      100% { left: 100%; width: 30%; }
    }
  </style>

<body style="background-color: #121011; margin: 0; padding: 0;">
  <!-- Elegant Dark Preloader -->
  <div id="loading-splash">
    <!-- Glowing Sacred Icon -->
    <div style="position: relative; width: 84px; height: 84px; margin-bottom: 24px;">
      <div style="position: absolute; inset: -10px; background: radial-gradient(circle, rgba(224,255,51,0.3) 0%, transparent 70%); border-radius: 50%; animation: pulseGlow 2s ease-in-out infinite;"></div>
      <div style="width: 100%; height: 100%; border-radius: 26px; background: #1A1819; border: 1.5px solid rgba(224,255,51,0.4); display: flex; align-items: center; justify-content: center; box-shadow: 0 15px 40px rgba(0,0,0,0.9); position: relative; z-index: 1;">
        <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#E0FF33" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
        </svg>
      </div>
    </div>

    <!-- Devotional Typography -->
    <h1 style="font-size: 24px; font-weight: 800; margin: 0 0 8px 0; color: #ffffff; letter-spacing: -0.5px; font-family: 'Outfit', sans-serif;">
      Foody Vrinda <span style="font-size: 13px; color: #E0FF33; font-weight: 700; background: rgba(224,255,51,0.12); border: 1px solid rgba(224,255,51,0.25); padding: 2px 8px; border-radius: 999px; vertical-align: middle; margin-left: 6px;">Vrindopnishad</span>
    </h1>

    <p style="color: #71717a; font-size: 13px; font-weight: 500; margin: 0 0 24px 0; max-width: 320px; text-align: center; line-height: 1.5;">
      Authentic Satvik Cloud Kitchen & Divine Prasad Delivery
    </p>

    <!-- Luxury Micro Progress Bar -->
    <div style="width: 150px; height: 3px; background: rgba(255,255,255,0.08); border-radius: 999px; overflow: hidden; position: relative;">
      <div style="position: absolute; top: 0; height: 100%; background: linear-gradient(90deg, transparent, #E0FF33, transparent); border-radius: 999px; animation: progressAnim 1.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;"></div>
    </div>
  </div>

  <script>
    function hideLoadingSplash() {
      var splash = document.getElementById('loading-splash');
      if (splash && splash.style.opacity !== '0') {
        splash.style.pointerEvents = 'none';
        splash.style.opacity = '0';
        setTimeout(function() {
          if (splash && splash.parentNode) {
            splash.parentNode.removeChild(splash);
          }
        }, 400);
      }
    }

    // Dismiss when Flutter view or glass pane attaches to DOM
    var observer = new MutationObserver(function(mutations, obs) {
      if (document.querySelector('flutter-view, flt-glass-pane, flt-scene-host, canvas')) {
        setTimeout(hideLoadingSplash, 200);
        obs.disconnect();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });

    // Fallback timer to prevent getting stuck
    setTimeout(hideLoadingSplash, 3000);
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
